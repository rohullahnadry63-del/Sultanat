<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سلطنت – رهنما و معاملات</title>
<style>
:root{--bg:#fbf8f1;--card:#fff;--ink:#1a1a1a;--mute:#6b6252;--gold:#b8860b;--gold2:#e6b422;--line:#e8dcc0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0e0b;--card:#1a1812;--ink:#f3ecd9;--mute:#a89a78;--line:#3a3220}}
:root[data-theme="dark"]{--bg:#0f0e0b;--card:#1a1812;--ink:#f3ecd9;--mute:#a89a78;--line:#3a3220}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,system-ui,sans-serif;line-height:1.7}
header{background:#111;color:#e6b422;padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header img{height:50px}header h1{font-size:17px;margin:0;flex:1}
header select{background:#222;color:#e6b422;border:1px solid #b8860b;border-radius:8px;padding:6px;max-width:48vw}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line)}
nav button{white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 14px;border-radius:20px;font:inherit;cursor:pointer}
nav button.on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#111;border-color:var(--gold);font-weight:700}
main{max-width:900px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.grid2 b{display:block}
.stat{text-align:center}.stat b{display:block;font-size:26px;color:var(--gold)}.stat span{color:var(--mute);font-size:13px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.btn{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#111;border:0;padding:10px 16px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer}
.item{display:flex;justify-content:space-between;gap:8px;align-items:center;border-top:1px solid var(--line);padding:10px 0}
small{color:var(--mute);display:block}.tag{background:var(--gold);color:#111;border-radius:8px;padding:1px 8px;font-size:12px}
.x{background:none;border:0;color:#b33;cursor:pointer;font-size:18px}
.note{background:#fff7dd;color:#5a4500;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:10px}
.hide{display:none}.idc{border:2px solid var(--gold)}

#authGate{position:fixed;inset:0;z-index:1000;background:var(--bg);display:grid;place-items:center;padding:20px}
#authCard{width:min(440px,100%);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 12px 40px #0002}
#authCard h2{text-align:center;color:var(--gold);margin-top:0}#authCard label{display:block;margin:10px 0 4px}#authCard input{margin-bottom:8px}#authMsg{min-height:26px;color:var(--mute);font-size:13px}
#lockBtn{border:1px solid #b8860b;background:#222;color:#e6b422;border-radius:8px;padding:6px 10px;font:inherit}
</style>
</head>
<body>
<div id="authGate">
 <div id="authCard">
  <h2>♛ سلطنت</h2>
  <p style="text-align:center">ورود امن مدیر سلطنت</p>
  <div id="authEmailStep">
   <label for="authEmail">ایمیل مدیر</label><input id="authEmail" type="email" value="rohullahnadry63@gmail.com" readonly>
   <button class="btn" id="sendOtp" style="width:100%">فرستادن کد تأیید به Gmail</button>
   <label for="authOtp">کد شش‌رقمی ایمیل</label><input id="authOtp" inputmode="numeric" maxlength="6" placeholder="کد ایمیل">
   <button class="btn" id="verifyOtp" style="width:100%">تأیید و ادامه</button>
   <button class="btn" id="showStaffLogin" type="button" style="width:100%;margin-top:8px;background:#222;color:#e6b422">ورود کارمندان</button>
  </div>
  <div id="authStaffStep" class="hide">
   <label for="staffRole">نام کارمند</label><select id="staffRole"><option value="sadis">سدیس</option><option value="khalid">خالد</option><option value="warith">وارث</option><option value="baesith">باعث</option></select>
   <label for="staffPin">رمز شش‌رقمی</label><input id="staffPin" type="password" inputmode="numeric" maxlength="6" placeholder="رمز کارمند">
   <button class="btn" id="staffLogin" style="width:100%">ورود کارمند</button>
   <button class="btn" id="backManager" type="button" style="width:100%;margin-top:8px;background:#222;color:#e6b422">بازگشت به ورود مدیر</button>
  </div>
  <div id="authPinStep" class="hide">
   <label for="newPin">رمز چهاررقمی مدیر</label><input id="newPin" type="password" inputmode="numeric" maxlength="4" placeholder="رمز جدید">
   <label for="confirmPin">تکرار رمز</label><input id="confirmPin" type="password" inputmode="numeric" maxlength="4" placeholder="تکرار رمز">
   <button class="btn" id="savePin" style="width:100%">ثبت رمز و ورود</button>
  </div>
  <div id="authUnlockStep" class="hide">
   <label for="unlockPin">رمز چهاررقمی ورود</label><input id="unlockPin" type="password" inputmode="numeric" maxlength="4" placeholder="رمز مدیر">
   <button class="btn" id="unlockBtn" style="width:100%">ورود به سلطنت</button>
  </div>
  <p id="authMsg" aria-live="polite"></p>
 </div>
</div>

async function loadCustomers(force=false){
 if(customerLoading||(!force&&customerLoaded))return;
 const c=window.saltanatSupabase;if(!c)return;
 customerLoading=true;
 try{

  CUSTOMER_PROPERTIES=pe?[]:(props||[]);

 finally{customerLoading=false;}

async function saveF(id){const r=rowF(id);if(!r)return;
 try{const d=await claude.use("downloads");if(!d)return msg("ذخیره‌ی فایل در این نمایش ممکن نیست.");

  else blob=await (await fetch(s)).blob();

  n=n.replace(/\.[^.]*$/,"")+"."+ext;

 catch(e){msg("ذخیره نشد: "+(e&&(e.code||e.message)||"خطا"))}}
